# InSite frontend — serves the repo root so the frontend's relative
# fetch (../config/floorplan.json) resolves correctly. Visit /frontend/
# in a browser.
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /opt/insite;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Belt-and-suspenders: block accidental exposure of anything outside
    # what the frontend needs, in case the repo root grows other content.
    location ~ ^/(server|deploy|tools|firmware)/ {
        deny all;
    }

    # node_positions.json isn't read by the frontend (only the backend
    # server uses it) — no reason to serve it publicly.
    location = /config/node_positions.json {
        deny all;
    }
}
